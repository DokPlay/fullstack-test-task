services:
  backend-prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:latest
    container_name: backend-prometheus
    restart: unless-stopped
    depends_on:
      - backend
      - backend-worker
      - backend-beat
      - backend-redis
      - backend-db
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-redis-exporter:
    profiles:
      - monitoring
    image: oliver006/redis_exporter:v1.76.0
    container_name: backend-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://backend-redis:6379

  backend-postgres-exporter:
    profiles:
      - monitoring
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: backend-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@backend-db:5432/test?sslmode=disable

  backend-worker:
    profiles:
      - monitoring
    ports:
      - "9101:9101"

  backend-beat:
    profiles:
      - monitoring
    ports:
      - "9102:9102"

  backend-grafana:
    profiles:
      - monitoring
    image: grafana/grafana
    container_name: backend-grafana
    restart: unless-stopped
    depends_on:
      backend-prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prometheus-data:
  grafana-data:
