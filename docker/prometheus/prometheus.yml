global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend-api"
    static_configs:
      - targets:
          - "backend:8000"
    metrics_path: /metrics

  - job_name: "backend-worker"
    static_configs:
      - targets:
          - "backend-worker:9101"

  - job_name: "backend-beat"
    static_configs:
      - targets:
          - "backend-beat:9102"

  - job_name: "backend-redis"
    static_configs:
      - targets:
          - "backend-redis-exporter:9121"

  - job_name: "backend-postgres"
    static_configs:
      - targets:
          - "backend-postgres-exporter:9187"
